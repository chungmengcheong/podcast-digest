[project]
name = "podcast-digest"
version = "0.1.0"
description = "Personal CLI for turning podcast transcripts into an evidence-aware reading digest"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.61.0",
]

[project.scripts]
poddigest = "podcast_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
